name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check CLI
        run: node --check bin/bloom.js

      - name: Doc-drift check
        run: npm run check:docs

      - name: Scaffold smoke tests
        run: npm run test:smoke

      - run: npm ci

      - name: Route contracts (runtime + compile-time)
        run: npm run test:contract

  # Installs every preset for real, typechecks it, and boots the web presets.
  # The file-only smoke tests above could not catch a server.ts that failed
  # to parse (5.3.2); this job can.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Scaffold, install, typecheck and boot every preset
        run: npm run test:build
        env:
          BLOOM_SMOKE_BUILD: '1'
